name: npm backfill

# One-off workflow to re-publish npm versions that were never shipped (the
# v1.11.0 / v1.12.0 / v1.23.0 gap). The normal release.yml only publishes the
# version on the tip of main, so it cannot cover these. This workflow takes a
# version, checks out the matching tag, runs the same gates as a release, and
# publishes exactly the verified tarball to npm via OIDC trusted publishing.
# It deliberately does NOT touch git tags or GitHub Releases -- those already
# exist for the backfilled versions.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to backfill (e.g. 1.11.0). The tag v<version> must exist.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Validate and package <version>
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The tag is the source of truth; the branch this workflow runs from
          # is irrelevant.
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm the checked-out version matches the input
        run: |
          set -euo pipefail
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "${{ inputs.version }}" ]; then
            echo "::error::checked out version $actual != requested ${{ inputs.version }}"
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # Same suite release.yml runs before shipping anything.
      - name: Test suites
        run: pnpm test

      # The tag's own scripts/verify-pack.mjs predates the skip switch (and the
      # notes/version-shape invariants), so it would fail on retrofitted
      # history no matter what. Overlay the current tree's check scripts before
      # running them; they are not part of the published artifact, so the
      # archive's contents stay the tag's.
      - name: Use the current verify-pack checks
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout FETCH_HEAD -- \
            scripts/verify-pack.mjs \
            scripts/lib/release-shape.mjs \
            scripts/lib/source-text.mjs

      # The same archive-content assertions CI runs. Backfill mode skips the
      # version-shape checks (notes sheet / PLUGIN_VERSION / publish window):
      # those invariants postdate the recorded tags and cannot be retrofitted.
      - name: Verify the archive contents
        run: node scripts/verify-pack.mjs
        env:
          DSH_SKIP_VERSION_SHAPE: "1"

      - name: Pack and hash
        run: |
          set -euo pipefail
          mkdir -p dist
          pnpm pack --pack-destination dist --ignore-scripts
          cd dist
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # Must be the SAME tag the build job packed: the publish probe reads the
      # version from package.json, and if this job checks out main instead, it
      # probes the tip version and reports "already published" for the wrong
      # version -- leaving the backfill silently unpublished.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@12.2.0
      - run: npm --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: dist

      - name: Verify the downloaded checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish with trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          registry=https://registry.npmjs.org
          probe="$RUNNER_TEMP/npm-probe.log"
          packageProbe="$RUNNER_TEMP/npm-package-probe.log"

          # Same E404 distinction as release.yml: "no such package" is a setup
          # problem, "no such version" is the normal backfill case.
          if ! npm view "$package" version --json --registry="$registry" >"$packageProbe" 2>&1; then
            if grep -q 'E404' "$packageProbe"; then
              echo "::error::$package is not on the registry yet, so it has no trusted publisher to publish against. Run \`npm publish --access public\` once from a machine logged in to npm, then re-run this job."
              exit 1
            fi
            cat "$packageProbe"
            echo "::error::could not read $package from the registry; refusing to publish."
            exit 1
          fi

          if npm view "$package@$version" version --json --registry="$registry" >"$probe" 2>&1; then
            echo "$package@$version is already published; nothing to do."
            exit 0
          elif grep -q 'E404' "$probe"; then
            shopt -s nullglob
            packages=(dist/*.tgz)
            if [ "${#packages[@]}" -ne 1 ]; then
              echo "::error::expected exactly one tarball in dist/, found ${#packages[@]}"
              ls -la dist || true
              exit 1
            fi
            echo "Publishing ${packages[0]} -> $package@$version"
            npm publish "./${packages[0]}" \
              --access public \
              --tag latest \
              --provenance \
              --ignore-scripts \
              --registry="$registry"
          else
            cat "$probe"
            echo "::error::could not determine whether $package@$version exists; refusing to publish."
            exit 1
          fi

          # Registry read lags a successful write; verify with retries, never
          # re-publish.
          for attempt in $(seq 1 30); do
            if npm view "$package@$version" version --prefer-online --registry="$registry"; then
              echo "Verified on the registry: $package@$version"
              exit 0
            fi
            echo "not visible yet (attempt $attempt/30); waiting 10s"
            sleep 10
          done
          echo "::error::$package@$version was published and npm exited 0, but it is still not readable after ~5m. Check https://www.npmjs.com/package/$package/v/$version before retrying."
          exit 1
