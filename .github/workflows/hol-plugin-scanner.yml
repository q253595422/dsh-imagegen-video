# HOL AI Plugin Scanner: scores this repository on every push and pull request.
# - Read-only token, no secrets, checkout credentials are not persisted.
# - Every action is pinned to a full commit SHA; the scanner wheel is verified
#   against a committed SHA-256 and PyPI provenance before it runs.
# Guide: https://github.com/hashgraph-online/awesome-ai-plugins/blob/main/SCANNER_GUIDE.md
#
# Advisory only: the score gate pins the 75-point listing threshold, but finding
# severities never fail this job (fail_on_severity: none). The listing gate lives
# in the catalog repository, not here.
name: HOL Plugin Scanner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hol-plugin-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: HOL Plugin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same pin as the other workflows in this repository (v7.0.1) instead of
      # the template's v4.2.2: the scanner only requires a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@c96833de5070fab4e564010b5ab6e3c3d7e07a3e # v1.2.806
        with:
          plugin_dir: "."
          min_score: 75
          fail_on_severity: none
